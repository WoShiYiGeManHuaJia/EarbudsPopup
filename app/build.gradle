plugins {
    id 'com.android.application'
}

android {
    namespace 'com.earpopupx'
    compileSdk 34

    defaultConfig {
        applicationId "com.earpopupx"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // 新架构源码放在 src-noroot，旧的 src/main 不再参与编译
    sourceSets {
        main {
            manifest.srcFile 'src-noroot/AndroidManifest.xml'
            java.srcDirs = ['src-noroot/java']
            res.srcDirs = ['src-noroot/res']
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
