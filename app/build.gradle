plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yuanbao.earbuds'
    compileSdk 34

    defaultConfig {
        applicationId "com.yuanbao.earbuds"
        minSdk 26
        targetSdk 33
        versionCode 210
        versionName "2.1"
    }

    // 发布签名：密钥库由 CI 注入，本地没有时自动退回未签名配置
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // 开启 R8 代码压缩：第三方库（Material / Glide / AppCompat / Shizuku）
            // 全量打包会让 dex 膨胀到 8.8MB，安装与启动都受影响。
            // proguard-rules.pro 里已 keep 住本 App 的全部代码，
            // 所以这里只缩减用不到的第三方代码，自身行为完全不变。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // debug 也用同一把密钥，保证 debug 与 release 可以互相覆盖安装
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Shizuku / Stellar：用于 App 内直接执行 shell 命令（免 Root 授权自身）
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
