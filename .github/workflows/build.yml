name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          {
            echo "=== ANDROID_HOME=$ANDROID_HOME"
            echo "=== platforms:"; ls "$ANDROID_HOME/platforms" 2>&1
            echo "=== build-tools:"; ls "$ANDROID_HOME/build-tools" 2>&1
            echo "=== java:"; java -version 2>&1
          } > build-log.txt

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/earbuds.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/earbuds.jks" >> "$GITHUB_ENV"
            echo "keystore decoded" >> build-log.txt
          else
            echo "no keystore secret, unsigned build" >> build-log.txt
          fi

      - name: Build Release APK (signed)
        id: gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          echo "=== GRADLE BUILD ===" >> build-log.txt
          ./gradlew assembleRelease --stacktrace --no-daemon >> build-log.txt 2>&1
          GRADLE_EXIT=$?
          echo "gradle_exit=$GRADLE_EXIT" >> build-log.txt
          if [ "$GRADLE_EXIT" != "0" ]; then
            echo "=== FALLBACK assembleDebug ===" >> build-log.txt
            ./gradlew assembleDebug --stacktrace --no-daemon >> build-log.txt 2>&1
            echo "fallback_exit=$?" >> build-log.txt
          fi
          echo "=== OUTPUTS ===" >> build-log.txt
          find app/build/outputs/apk -name "*.apk" >> build-log.txt 2>&1

      - name: Publish build log
        if: always()
        run: |
          tail -150 build-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add -f build-log.txt
          git commit -m "build log run ${{ github.run_number }}" || echo "nothing to commit"
          git push -f origin build-logs

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: earbuds-popup-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Publish APK to repo branch (apk)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk
          mkdir -p apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk apk/earbuds-popup-release.apk
            git add -f apk/earbuds-popup-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk apk/earbuds-popup-debug.apk
            git add -f apk/earbuds-popup-debug.apk
          fi
          git commit -m "APK ${{ github.run_number }}"
          git push -f origin apk
