name: Build EarbudsPopup2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify signing keystore
        run: |
          ls -la release.keystore
          keytool -list -v -keystore release.keystore -storepass android -alias release | grep -E "Alias name|SHA1:|Valid"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release APK
        id: build
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build_log.txt
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV
          exit 0

      - name: Publish build log
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/logout && mkdir -p /tmp/logout
          cp build_log.txt /tmp/logout/ 2>/dev/null || echo "no log" > /tmp/logout/build_log.txt
          git checkout --orphan logs-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf $(ls -A | grep -v '^\.git$') || true
          cp /tmp/logout/build_log.txt .
          git add -f build_log.txt
          git commit -m "build log $GITHUB_RUN_ID" || echo "no change"
          git push -f origin HEAD:build-logs || echo "push failed"

      - name: Fail if build failed
        if: env.GRADLE_EXIT != '0'
        run: exit 1

      - name: Show APK signature
        if: always()
        run: |
          for f in app/build/outputs/apk/release/*.apk; do
            echo "=== $f ==="
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$f" 2>/dev/null | head -5 || true
          done

      - name: Push APK to apk branch
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/apkout && mkdir -p /tmp/apkout
          cp app/build/outputs/apk/release/*.apk /tmp/apkout/ || true
          ls -la /tmp/apkout
          git checkout --orphan apk-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf $(ls -A | grep -v '^\.git$') || true
          mkdir -p out
          cp /tmp/apkout/*.apk out/ || true
          git add -f out
          git commit -m "APK build $GITHUB_RUN_ID" || echo "no change"
          git push -f origin HEAD:apk || echo "push failed"
