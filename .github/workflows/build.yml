name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          {
            echo "=== ANDROID_HOME=$ANDROID_HOME"
            echo "=== platforms:"; ls "$ANDROID_HOME/platforms" 2>&1
            echo "=== build-tools:"; ls "$ANDROID_HOME/build-tools" 2>&1
            echo "=== java:"; java -version 2>&1
          } > build-log.txt

      - name: Build Debug APK
        id: gradle
        run: |
          chmod +x ./gradlew
          echo "=== GRADLE BUILD ===" >> build-log.txt
          ./gradlew assembleDebug --stacktrace --no-daemon >> build-log.txt 2>&1
          echo "gradle_exit=$?" >> build-log.txt

      - name: Publish build log
        if: always()
        run: |
          tail -150 build-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add -f build-log.txt
          git commit -m "build log run ${{ github.run_number }}" || echo "nothing to commit"
          git push -f origin build-logs

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: earbuds-popup-debug
          path: app/build/outputs/apk/debug/*.apk
