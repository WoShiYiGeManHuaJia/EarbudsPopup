name: Build EarbudsPopup Legacy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          {
            echo "=== LEGACY ANDROID_HOME=$ANDROID_HOME"
            echo "=== platforms:"; ls "$ANDROID_HOME/platforms" 2>&1
            echo "=== build-tools:"; ls "$ANDROID_HOME/build-tools" 2>&1
            echo "=== java:"; java -version 2>&1
          } > legacy-log.txt

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/earbuds.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/earbuds.jks" >> "$GITHUB_ENV"
            echo "keystore decoded" >> legacy-log.txt
          else
            echo "no keystore secret" >> legacy-log.txt
          fi

      - name: Build Release APK
        id: gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          echo "=== LEGACY GRADLE BUILD ===" >> legacy-log.txt
          ./gradlew assembleRelease --stacktrace --no-daemon >> legacy-log.txt 2>&1
          GRADLE_EXIT=$?
          echo "gradle_exit=$GRADLE_EXIT" >> legacy-log.txt
          if [ "$GRADLE_EXIT" != "0" ]; then
            echo "=== FALLBACK assembleDebug ===" >> legacy-log.txt
            ./gradlew assembleDebug --stacktrace --no-daemon >> legacy-log.txt 2>&1
            echo "fallback_exit=$?" >> legacy-log.txt
          fi
          echo "=== OUTPUTS ===" >> legacy-log.txt
          find app/build/outputs/apk -name "*.apk" >> legacy-log.txt 2>&1

      - name: Publish build log
        if: always()
        run: |
          tail -300 legacy-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B legacy-logs
          git add -f legacy-log.txt
          git commit -m "legacy build log run ${{ github.run_number }}" || echo "nothing to commit"
          git push -f origin legacy-logs

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-build-log
          path: legacy-log.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: earbudspopup-legacy
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Publish APK to apk branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk
          mkdir -p apk
          RUN="${{ github.run_number }}"
          SRC=""
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ -n "$SRC" ]; then
            cp "$SRC" apk/EarbudsPopup.apk
            cp "$SRC" "apk/EarbudsPopup-r$RUN.apk"
            git add -f apk/EarbudsPopup.apk
            git add -f "apk/EarbudsPopup-r$RUN.apk"
          else
            echo "NO APK FOUND" >> legacy-log.txt
          fi
          git commit -m "EarbudsPopup legacy APK run $RUN" || echo "nothing to commit"
          git push -f origin apk
