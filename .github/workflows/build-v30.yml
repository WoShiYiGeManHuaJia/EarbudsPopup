name: Build EarPopupX 3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "=== platforms:" > v30-log.txt
          ls "$ANDROID_HOME/platforms" >> v30-log.txt 2>&1
          echo "=== build-tools:" >> v30-log.txt
          ls "$ANDROID_HOME/build-tools" >> v30-log.txt 2>&1

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/earbuds.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/earbuds.jks" >> "$GITHUB_ENV"
            echo "keystore decoded" >> v30-log.txt
          else
            echo "no keystore secret" >> v30-log.txt
          fi

      - name: Ensure gradle wrapper
        run: |
          cd EarPopupX-Ultimate
          echo "=== system gradle:" >> ../v30-log.txt
          (gradle --version || true) >> ../v30-log.txt 2>&1
          (gradle wrapper --gradle-version 8.2 --distribution-type bin || true) >> ../v30-log.txt 2>&1
          ls -la >> ../v30-log.txt 2>&1

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd EarPopupX-Ultimate
          echo "=== V30 GRADLE BUILD ===" >> ../v30-log.txt
          if [ -x ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace --no-daemon >> ../v30-log.txt 2>&1
            GRADLE_EXIT=$?
          else
            gradle assembleRelease --stacktrace --no-daemon >> ../v30-log.txt 2>&1
            GRADLE_EXIT=$?
          fi
          echo "gradle_exit=$GRADLE_EXIT" >> ../v30-log.txt
          echo "=== OUTPUTS ===" >> ../v30-log.txt
          find app/build/outputs/apk -name "*.apk" >> ../v30-log.txt 2>&1

      - name: Publish build log
        if: always()
        run: |
          tail -300 v30-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B v30-logs
          git add -f v30-log.txt
          git commit -m "v30 build log run ${{ github.run_number }}" || echo "nothing to commit"
          git push -f origin v30-logs

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v30-build-log
          path: v30-log.txt

      - name: Publish APK to repo branch (apk)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk
          mkdir -p apk
          if [ -f EarPopupX-Ultimate/app/build/outputs/apk/release/app-release.apk ]; then
            cp EarPopupX-Ultimate/app/build/outputs/apk/release/app-release.apk apk/EarPopupX-3.0.apk
            git add -f apk/EarPopupX-3.0.apk
          fi
          if [ -f EarPopupX-Ultimate/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp EarPopupX-Ultimate/app/build/outputs/apk/debug/app-debug.apk apk/EarPopupX-3.0-debug.apk
            git add -f apk/EarPopupX-3.0-debug.apk
          fi
          git commit -m "EarPopupX 3.0 APK run ${{ github.run_number }}"
          git push -f origin apk
