plugins {
    id 'com.android.application'
}

android {
    namespace 'com.earpopupx'
    compileSdk 35

    defaultConfig {
        applicationId 'com.earpopupx'
        minSdk 29
        targetSdk 35
        versionCode 208
        versionName '2.8.0'
    }

    // Shizuku 的 AIDL 已内置在 src/main/aidl，CI 不需要联网拉任何远程库
    buildFeatures {
        aidl true
    }

    // 必须用与 2.0 相同的正式密钥签名，否则用户无法覆盖安装（安装失败 -7）
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
