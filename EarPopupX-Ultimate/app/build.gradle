plugins {
    id 'com.android.application'
}

android {
    namespace 'com.earpopupx'
    compileSdk 35
    defaultConfig {
        applicationId 'com.earpopupx'
        minSdk 29
        targetSdk 35
        versionCode 201
        versionName '2.1.0'
    }

    // The CI has no release keystore configured, so assembleRelease would emit
    // an *unsigned* apk that cannot be installed. Sign the release build with
    // the standard debug key so the produced file is installable as-is.
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
